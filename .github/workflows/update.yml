name: Radyoloji Pulse güncelle

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radyoloji-pulse-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Makaleleri çek ve skorla
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL:   ${{ secrets.NCBI_EMAIL }}
        run: python fetch_articles.py
      - name: Değişiklikleri commit'le
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json best2026.json
          git diff --staged --quiet && echo "değişiklik yok" && exit 0
          git commit -m "veri güncellendi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            git push && break
            echo "push tekrar deneniyor ($i)..."; sleep 5
          done
      - name: Günlük bülteni e-posta ile gönder
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO:       ${{ secrets.MAIL_TO }}
        run: python send_newsletter.py
